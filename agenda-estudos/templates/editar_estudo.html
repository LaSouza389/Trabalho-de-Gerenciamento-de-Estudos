<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Estudo</title>
</head>
<body>
    <h1>Editar Estudo</h1>

    <form action= "/editar_estudo/{{ estudo.id }}" method="POST">

        <label for ="materia"> Matéria: </label>
        <input type="text"
               id="materia"
               name="materia"
               value="{{ estudo.materia }}"
               required>
             
        <br><br>
        <label for="descricao">Descrição: </form>
        <input type="text"
               id="descricao"
               name="descricao"
               value="{{ estudo.descricao or '' }}">

        <br><br>
        <label for="data">Data: </label>
        <input type="date"
               id="data"
               name="data"
               value="{% if estudo.data != 'Sem data final' %}{{ estudo.data }}{% endif %}">

        <br><br>

        <label for="secao"> Seção: </label>
        <input type="text"
               id="secao"
               name="secao"
               value="{{ estudo.secao }}"
               required>
        
        <br><br>

        <button type="Submit"> 
            Salvar Alterações
        </button>

    </form>

    <br>

    <a href="/agenda"> Voltar à Agenda </a>
</body>
</html>
